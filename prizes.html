<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Prizes</title>
  <link rel="icon" href="pickora-icon.png" type="image/png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="feature-page">
  <div class="board-backdrop" aria-hidden="true"></div>
  <img class="board-logo" id="boardLogo" alt="" hidden>

  <header class="board-header">
    <div class="board-identity">
      <h1 class="event-name" id="eventName">Pickora</h1>
      <p class="organization-name" id="organizationName" hidden></p>
    </div>
    <nav class="screen-nav" id="screenNav" aria-label="Screens"></nav>

    <nav class="board-tools" aria-label="Page controls">
      <!-- FIX: the only way back to the board was the JS-rendered screen nav,
           so a failed settings request left this page with no way out at all.
           This link is in the markup and works whatever the API does. -->
      <a class="tool tool-back" id="backToBoard" href="/">Back to the draw</a>
      <!-- Its own tab, so the projected screen is never navigated away from,
           and a named one, so a second click returns to the console already
           open rather than stacking up another. -->
      <a class="tool tool-quiet" href="/admin" target="pickora-console" data-console-link>Organiser</a>
    </nav>
  </header>

  <main class="feature" aria-labelledby="featureHeading">
    <header class="feature-intro">
      <h2 class="feature-eyebrow" id="featureHeading">Prizes</h2>
      <p class="feature-lede" id="prizesIntro" hidden></p>
    </header>
    <ol class="prize-list" id="prizeList"></ol>
    <p class="feature-empty" id="prizesEmpty" hidden>No prizes have been added yet.</p>
  </main>

  <footer class="board-footer"><p id="boardFooter"></p></footer>

  <script>window.PICKORA_PAGE = 'prizes';</script>
  <script src="api.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="carousel.js" defer></script>
  <script src="feature-page.js" defer></script>
</body>
</html>
