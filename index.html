<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pickora</title>
  <link rel="icon" href="pickora-icon.png" type="image/png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board-backdrop" aria-hidden="true"></div>
  <canvas id="confettiCanvas" aria-hidden="true"></canvas>

  <div class="loading" id="loading">
    <span class="spinner" aria-hidden="true"></span>
    <p id="loadingText">Preparing the draw…</p>
  </div>

  <p class="notice" id="notice" role="status" hidden></p>

  <img class="board-logo" id="boardLogo" alt="" hidden>

  <header class="board-header">
    <div class="board-identity">
      <h1 class="event-name" id="eventName">Pickora</h1>
      <p class="organization-name" id="organizationName" hidden></p>
    </div>

    <!-- NEW: the menu is a drawer now. The toggle is the only part left over
         the screen, so a projected board or a photo is not covered by it. The
         way back to the draw stays outside the drawer: it is the one control
         that must never be a click away. -->
    <div class="board-menu">
      <button type="button" class="menu-toggle" id="menuToggle" aria-controls="boardDrawer"
              aria-expanded="false" aria-label="Menu" title="Menu (M)">
        <span class="menu-bars" aria-hidden="true"></span>
      </button>
    </div>

    <div class="board-drawer" id="boardDrawer" hidden>
      <nav class="screen-nav" id="screenNav" aria-label="Screens"></nav>

      <nav class="board-tools" aria-label="Board controls">
      <button type="button" class="tool" id="winnersToggle" aria-controls="winnersPanel" aria-expanded="false">
        <span class="tool-label" id="winnersToggleLabel">Winners</span>
        <span class="tool-badge" id="winnersBadge">0</span>
      </button>
      <button type="button" class="tool" id="fullscreenBtn" title="Fullscreen (F)">
        <span class="tool-label">Fullscreen</span>
      </button>
      <!-- Opens in its own tab so the board being projected stays put, and in
           a *named* tab so a second click returns to the console already open
           rather than stacking up another. rel="noopener" is deliberately
           absent: it forces a fresh context every time, which would defeat
           that, and the console is our own same-origin page. -->
      <a class="tool tool-quiet" id="organiserLink" href="/admin" target="pickora-console" data-console-link>Organiser</a>
      </nav>
    </div>
  </header>

  <div class="drawer-scrim" id="drawerScrim" hidden></div>

  <main class="board" aria-labelledby="eventName">
    <section class="stage" id="stage" data-status="idle" aria-live="polite" aria-atomic="true">
      <div class="stage-reel" id="reel">
        <p class="stage-message">
          <span class="stage-message-title">Ready to draw</span>
        </p>
      </div>
    </section>

    <div class="controls">
      <button type="button" class="control control-start" id="startBtn">
        <span class="control-text">Start</span>
        <span class="control-key" aria-hidden="true">Space</span>
      </button>
      <button type="button" class="control control-stop" id="stopBtn" disabled>
        <span class="control-text">Stop</span>
        <span class="control-key" aria-hidden="true">Space</span>
      </button>
      <button type="button" class="control control-reset" id="newDrawBtn">
        <span class="control-text" id="newDrawLabel">New draw</span>
        <span class="control-key" aria-hidden="true">N</span>
      </button>
    </div>

    <dl class="stats" id="stats" hidden>
      <div class="stat">
        <dt>Prizes</dt>
        <dd id="totalPrizes">—</dd>
      </div>
      <div class="stat">
        <dt>Remaining</dt>
        <dd id="remainingPrizes">—</dd>
      </div>
      <div class="stat">
        <dt>Drawn</dt>
        <dd id="winnersCount">0</dd>
      </div>
    </dl>
  </main>

  <aside class="winners-panel" id="winnersPanel" aria-label="Winners so far" hidden>
    <h2 id="winnersHeading">Winners</h2>
    <ol class="winners-list" id="winnersList"></ol>
  </aside>

  <!-- NEW: filled in by social.js; stays hidden with nothing configured. -->
  <aside class="social-block" id="socialBlock" aria-label="Event channels" hidden></aside>

  <footer class="board-footer">
    <p id="boardFooter"></p>
  </footer>

  <script src="api.js" defer></script>
  <!-- NEW: the QR encoder and the channel block, shared by every public page. -->
  <script src="qr.js" defer></script>
  <script src="social.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="confetti.js" defer></script>
  <script src="reel.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
