<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Welcome</title>
  <link rel="icon" href="pickora-icon.png" type="image/png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="feature-page">
  <div class="board-backdrop" aria-hidden="true"></div>
  <img class="board-logo" id="boardLogo" alt="" hidden>

  <header class="board-header">
    <div class="board-identity">
      <h1 class="event-name" id="eventName">Pickora</h1>
      <p class="organization-name" id="organizationName" hidden></p>
    </div>
  </header>

  <!-- FIX: the menu floats over the page rather than sitting in the header.
       Inside it, its z-index was resolved in the header's own stacking
       context, so the winners panel covered it — and a top-centre logo
       pushes the header down far enough to put the two on top of each
       other. Nothing may cover the toggle: it is the only way in. -->
  <div class="board-menu">
    <a class="tool tool-back" id="backToBoard" href="/">Back to the draw</a>
    <button type="button" class="menu-toggle" id="menuToggle" aria-controls="boardDrawer"
            aria-expanded="false" aria-label="Menu" title="Menu (M)">
      <span class="menu-bars" aria-hidden="true"></span>
    </button>
  </div>

  <!-- FIX: the drawer lives beside the scrim rather than inside the
       header. As a child of the header its z-index was resolved inside
       the header's own stacking context, so the scrim painted over the
       whole drawer and swallowed every click meant for a menu item. -->
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <div class="board-drawer" id="boardDrawer" hidden>
    <!-- FIX: the open drawer covers the hamburger, so it carries its own
         close control, sitting exactly where the toggle is behind it. -->
    <button type="button" class="drawer-close" id="drawerClose" aria-label="Close menu" title="Close (Esc)">
      <span class="menu-bars" aria-hidden="true"></span>
    </button>
    <nav class="screen-nav" id="screenNav" aria-label="Screens"></nav>

    <nav class="board-tools" aria-label="Page controls">
      <!-- Its own tab, so the projected screen is never navigated away from,
           and a named one, so a second click returns to the console already
           open rather than stacking up another. -->
      <a class="tool tool-quiet" href="/admin" target="pickora-console" data-console-link>Organiser</a>
    </nav>
  </div>

  <!-- CHANGED: rebuilt around the hierarchy the screen actually has — a label,
       the heading, the message, and then the photographs as the thing everyone
       is looking at. The heading used to be set as a tiny eyebrow while the
       message ran at 3rem in a condensed display face, which is why the page
       read as shouty and unbalanced. -->
  <main class="feature welcome-stage" aria-labelledby="featureHeading">
    <section class="welcome" id="welcomeCard">
      <div class="welcome-glow" aria-hidden="true"></div>

      <div class="welcome-intro">
        <p class="welcome-eyebrow" id="welcomeEyebrow" hidden></p>
        <h2 class="welcome-title" id="featureHeading">Our special guest</h2>
        <span class="welcome-rule" aria-hidden="true"></span>
        <p class="welcome-message" id="welcomeMessage"></p>
      </div>

      <figure class="welcome-media" id="welcomeMedia"></figure>

      <nav class="welcome-actions" id="welcomeActions" aria-label="Where to next" hidden></nav>
    </section>
    <p class="feature-empty" id="welcomeEmpty" hidden>No welcome has been set up yet.</p>
  </main>

  <!-- NEW: filled in by social.js; stays hidden with nothing configured. -->
  <aside class="social-block" id="socialBlock" aria-label="Event channels" hidden></aside>

  <footer class="board-footer"><p id="boardFooter"></p></footer>

  <script>window.PICKORA_PAGE = 'welcome';</script>
  <script src="api.js" defer></script>
  <!-- NEW: the QR encoder and the channel block, shared by every public page. -->
  <script src="qr.js" defer></script>
  <script src="social.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="carousel.js" defer></script>
  <script src="feature-page.js" defer></script>
</body>
</html>
